<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstaClone</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
body{margin:0;font-family:-apple-system,Roboto,sans-serif;background:#fafafa;color:#262626;padding-bottom:60px}
.top{background:#fff;border-bottom:1px solid #dbdbdb;text-align:center;font-family:'Brush Script MT',cursive;font-size:30px;padding:8px}
.box{max-width:400px;margin:20px auto;background:#fff;border:1px solid #dbdbdb;padding:20px;text-align:center}
h1{font-family:'Brush Script MT',cursive;font-weight:400;font-size:42px;margin:0 0 20px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:4px 0;border:1px solid #dbdbdb;background:#fafafa;border-radius:4px;font-size:14px}
button{width:100%;padding:10px;margin-top:10px;background:#0095f6;color:#fff;border:0;border-radius:8px;font-weight:600;font-size:14px}
button:disabled{opacity:.5}
a{color:#0095f6;cursor:pointer;font-size:14px}
.avatar{width:80px;height:80px;border-radius:50%;background:#c7c7c7;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
#msg{color:#ed4956;font-size:13px;margin-top:10px}
.c{text-align:center;padding:30px 15px;color:#777}
.post{max-width:470px;margin:12px auto;background:#fff;border:1px solid #dbdbdb}
.ph{padding:10px}
.post img{width:100%;display:block}
.cap{padding:8px 10px;font-size:14px}
.dt{padding:0 10px 10px;font-size:11px;color:#888}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:470px;margin:0 auto}
.grid img{width:100%;aspect-ratio:1;object-fit:cover}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #dbdbdb}
.nav button{width:auto;flex:1;background:none;color:#262626;font-size:24px;margin:0;border-radius:0;padding:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const URL_='https://nyahimvlamdokjauehth.supabase.co';
const KEY_='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YWhpbXZsYW1kb2tqYXVlaHRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTEzNjAsImV4cCI6MjEwNzQ4NzM2MH0.IcHlX0DnLvezEBlPl9JCKQKlake5vo-ECScuhu11Pik';
const db=supabase.createClient(URL_,KEY_);
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const v=id=>$(id).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='login',user=null,tab='home';
function authView(){
  const su=mode==='signup';
  app.innerHTML=`<div class="box"><h1>InstaClone</h1>
  ${su?'<input id="username" placeholder="Username"><input id="fullname" placeholder="Full name">':''}
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (min 6)">
  <button id="go">${su?'Sign up':'Log in'}</button>
  <div id="msg"></div>
  <p><a id="sw">${su?'Account hai? Log in':'Account nahi hai? Sign up'}</a></p></div>`;
  $('sw').onclick=()=>{mode=su?'login':'signup';authView();};
  $('go').onclick=async()=>{
    const email=v('email'),password=v('password');
    $('msg').textContent='';
    if(su){
      if(!v('username')){$('msg').textContent='Username daalo';return;}
      const {data,error}=await db.auth.signUp({email,password,
        options:{data:{username:v('username'),full_name:v('fullname')}}});
      if(error)$('msg').textContent=error.message;
      else if(!data.session)$('msg').textContent='Email check karke confirm karo.';
    }else{
      const {error}=await db.auth.signInWithPassword({email,password});
      if(error)$('msg').textContent=error.message;
    }
  };
}

function shell(){
  app.innerHTML=`<div class="top">InstaClone</div><div id="main"></div>
  <div class="nav"><button data-t="home">🏠</button><button data-t="new">➕</button><button data-t="me">👤</button></div>`;
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;show();});
}
function show(){
  if(tab==='home')homeView();else if(tab==='new')newView();else profileView();
}

async function homeView(){
  const m=$('main');
  m.innerHTML='<p class="c">Loading...</p>';
  const {data,error}=await db.from('posts')
.select('id,image_url,caption,created_at,profiles!posts_user_id_fkey(username)')
    .order('created_at',{ascending:false}).limit(30);
  if(error){m.innerHTML=`<p class="c" style="color:#ed4956">${esc(error.message)}</p>`;return;}
  if(!data.length){m.innerHTML='<p class="c">Abhi koi post nahi. ➕ dabake pehla post daalo!</p>';return;}
  m.innerHTML=data.map(p=>`<div class="post">
    <div class="ph"><b>@${esc(p.profiles?.username)}</b></div>
    <img src="${esc(p.image_url)}" loading="lazy">
    <div class="cap"><b>${esc(p.profiles?.username)}</b> ${esc(p.caption)}</div>
    <div class="dt">${new Date(p.created_at).toLocaleDateString()}</div></div>`).join('');
}

function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,1080/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('Photo process nahi hui')),'image/jpeg',0.8);
    };
    img.onerror=()=>rej(new Error('Photo load nahi hui'));
    img.src=URL.createObjectURL(file);
  });
}

function newView(){
  $('main').innerHTML=`<div class="box"><h3>New post</h3>
  <input id="file" type="file" accept="image/*">
  <img id="pv" style="display:none;width:100%;margin-top:8px">
  <textarea id="cap" rows="3" placeholder="Caption likho..."></textarea>
  <button id="share">Share</button><div id="msg"></div></div>`;
  $('file').onchange=e=>{
    const f=e.target.files[0];
    if(f){$('pv').src=URL.createObjectURL(f);$('pv').style.display='block';}
  };
  $('share').onclick=async()=>{
    const f=$('file').files[0];
    if(!f){$('msg').textContent='Pehle photo chuno';return;}
    $('share').disabled=true;
    $('msg').style.color='#555';$('msg').textContent='Upload ho raha hai...';
    try{
      const blob=await compress(f);
      const path=`${user.id}/${Date.now()}.jpg`;
      const up=await db.storage.from('posts').upload(path,blob,{contentType:'image/jpeg'});
      if(up.error)throw up.error;
      const url=db.storage.from('posts').getPublicUrl(path).data.publicUrl;
      const ins=await db.from('posts').insert({user_id:user.id,image_url:url,caption:v('cap')});
      if(ins.error)throw ins.error;
      tab='home';show();
    }catch(e){
      $('msg').style.color='#ed4956';$('msg').textContent=e.message;
      $('share').disabled=false;
    }
  };
}

async function profileView(){
  const m=$('main');
  const {data:p}=await db.from('profiles').select('*').eq('id',user.id).single();
  const {data:posts}=await db.from('posts').select('id,image_url')
    .eq('user_id',user.id).order('created_at',{ascending:false});
  m.innerHTML=`<div class="box">
  <div class="avatar">${esc((p?.username||'?')[0].toUpperCase())}</div>
  <h3>@${esc(p?.username)}</h3><p>${esc(p?.full_name)}</p>
  <p><b>${posts?.length||0}</b> posts</p>
  <textarea id="bio" rows="3" placeholder="Bio">${esc(p?.bio)}</textarea>
  <button id="save">Save bio</button>
  <button id="out" style="background:#efefef;color:#262626">Log out</button>
  <div id="msg"></div></div>
  <div class="grid">${(posts||[]).map(x=>`<img src="${esc(x.image_url)}">`).join('')}</div>`;
  $('save').onclick=async()=>{
    const {error}=await db.from('profiles').update({bio:v('bio')}).eq('id',user.id);
    $('msg').style.color=error?'#ed4956':'#2e7d32';
    $('msg').textContent=error?error.message:'Saved!';
  };
  $('out').onclick=()=>db.auth.signOut();
}

db.auth.onAuthStateChange((ev,session)=>{
  if(ev==='TOKEN_REFRESHED')return;
  setTimeout(()=>{
    user=session?session.user:null;
    if(user){shell();show();}else authView();
  },0);
});
</script>
</body>
</html>
